<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hackathon Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #4b0082, #7b2cbf);
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #4b0082;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #7b2cbf;
        }

        button {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4b0082;
        }

        .success {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #7b2cbf;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .delete-btn {
            background: #dc3545;
            padding: 7px 12px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }

        footer {
            text-align: center;
            background: #222;
            color: white;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .container {
                width: 95%;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🚀 Hackathon 2026</h1>
        <p>Innovate • Build • Compete • Win</p>
    </header>


    <div class="container">

        <!-- Registration Form -->
        <div class="card">

            <h2>Student Registration</h2>

            <div id="successMessage" class="success">
                ✅ Registration successful!
            </div>

            <form id="registrationForm">

                <!-- Student Name -->
                <div class="form-group">
                    <label for="studentName">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>


                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        pattern="[0-9]{10}"
                        required
                    >
                </div>


                <!-- College -->
                <div class="form-group">
                    <label for="college">
                        College / University
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college name"
                        required
                    >
                </div>


                <!-- Team Name -->
                <div class="form-group">
                    <label for="teamName">
                        Team Name
                    </label>

                    <input
                        type="text"
                        id="teamName"
                        placeholder="Enter team name"
                        required
                    >
                </div>


                <!-- Team Size -->
                <div class="form-group">
                    <label for="teamSize">
                        Team Size
                    </label>

                    <select id="teamSize" required>

                        <option value="">
                            Select team size
                        </option>

                        <option value="1">
                            1 Member
                        </option>

                        <option value="2">
                            2 Members
                        </option>

                        <option value="3">
                            3 Members
                        </option>

                        <option value="4">
                            4 Members
                        </option>

                    </select>
                </div>


                <!-- Technology -->
                <div class="form-group">

                    <label for="technology">
                        Primary Technology
                    </label>

                    <select id="technology" required>

                        <option value="">
                            Select technology
                        </option>

                        <option value="Python">
                            Python
                        </option>

                        <option value="Java">
                            Java
                        </option>

                        <option value="JavaScript">
                            JavaScript
                        </option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="AI / ML">
                            AI / ML
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Project Idea -->
                <div class="form-group">

                    <label for="projectIdea">
                        Project Idea
                    </label>

                    <textarea
                        id="projectIdea"
                        placeholder="Briefly describe your project idea"
                        required
                    ></textarea>

                </div>


                <!-- Submit -->
                <button type="submit">
                    Register for Hackathon
                </button>

            </form>

        </div>


        <!-- Registered Students -->
        <div class="card">

            <h2>📋 Registered Students</h2>

            <!-- Search -->
            <div class="search-box">

                <input
                    type="text"
                    id="search"
                    placeholder="Search by student name, email or team..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Student</th>
                            <th>Email</th>
                            <th>College</th>
                            <th>Team</th>
                            <th>Team Size</th>
                            <th>Technology</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="studentTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Hackathon Registration System
        </p>

    </footer>


    <script>

        // Get existing registrations
        let registrations =
            JSON.parse(localStorage.getItem("registrations")) || [];


        // Form
        const form =
            document.getElementById("registrationForm");


        // Submit form
        form.addEventListener("submit", function(event) {

            event.preventDefault();


            // Get values
            const studentName =
                document.getElementById("studentName").value;

            const email =
                document.getElementById("email").value;

            const phone =
                document.getElementById("phone").value;

            const college =
                document.getElementById("college").value;

            const teamName =
                document.getElementById("teamName").value;

            const teamSize =
                document.getElementById("teamSize").value;

            const technology =
                document.getElementById("technology").value;

            const projectIdea =
                document.getElementById("projectIdea").value;


            // Create registration object
            const registration = {

                id: Date.now(),

                studentName: studentName,

                email: email,

                phone: phone,

                college: college,

                teamName: teamName,

                teamSize: teamSize,

                technology: technology,

                projectIdea: projectIdea

            };


            // Add registration
            registrations.push(registration);


            // Save to browser
            localStorage.setItem(
                "registrations",
                JSON.stringify(registrations)
            );


            // Show success message
            const success =
                document.getElementById("successMessage");

            success.style.display = "block";


            // Clear form
            form.reset();


            // Display registrations
            displayRegistrations();


            // Hide message after 3 seconds
            setTimeout(function() {

                success.style.display = "none";

            }, 3000);

        });


        // Display registrations
        function displayRegistrations(searchText = "") {

            const table =
                document.getElementById("studentTable");

            table.innerHTML = "";


            const filtered =
                registrations.filter(function(student) {

                    const search =
                        searchText.toLowerCase();

                    return (

                        student.studentName
                            .toLowerCase()
                            .includes(search)

                        ||

                        student.email
                            .toLowerCase()
                            .includes(search)

                        ||

                        student.teamName
                            .toLowerCase()
                            .includes(search)

                        ||

                        student.college
                            .toLowerCase()
                            .includes(search)

                    );

                });


            filtered.forEach(function(student, index) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>${index + 1}</td>

                    <td>${student.studentName}</td>

                    <td>${student.email}</td>

                    <td>${student.college}</td>

                    <td>${student.teamName}</td>

                    <td>${student.teamSize}</td>

                    <td>${student.technology}</td>

                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteRegistration(${student.id})"
                        >
                            Delete
                        </button>
                    </td>

                `;


                table.appendChild(row);

            });

        }


        // Delete registration
        function deleteRegistration(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this registration?"
                );


            if (!confirmDelete) {
                return;
            }


            registrations =
                registrations.filter(function(student) {

                    return student.id !== id;

                });


            localStorage.setItem(
                "registrations",
                JSON.stringify(registrations)
            );


            displayRegistrations();

        }


        // Search
        document
            .getElementById("search")
            .addEventListener("input", function() {

                displayRegistrations(this.value);

            });


        // Load registrations when page opens
        displayRegistrations();

    </script>

</body>
</html>
